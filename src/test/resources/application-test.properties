# datasource and kafka come from Testcontainers via @ServiceConnection
recommender.solr.enabled=false
recommender.solr.data-seed-enabled=false
spring.kafka.consumer.group-id=user-service-test

# test fixture instead of the gitignored src/main/resources/geo data
geo.postal-codes.location=classpath*:geo-test/postal-codes-*.tsv

# fixed key for tests (at least 32 bytes)
app.security.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes

# effectively no rate limits in tests (all requests come from one address); RateLimitIntegrationTest sets low limits
app.rate-limits.login-ip=100000/PT1M
app.rate-limits.login-email=100000/PT1M
app.rate-limits.registration-ip=100000/PT1M
app.rate-limits.password-change=100000/PT1M
app.rate-limits.reactions=100000/PT1M
app.rate-limits.chat-messages=100000/PT1M
app.rate-limits.reports=100000/PT1M
app.rate-limits.external-search=100000/PT1M

# the OpenAPI document is checked in UserApiIntegrationTest
springdoc.api-docs.enabled=true
