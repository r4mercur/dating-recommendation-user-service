# Local development only. Never use this key outside the dev profile.
app.security.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production}

# show which component is down when calling /actuator/health locally
management.endpoint.health.show-details=always

# all browser requests arrive via the Vite proxy from 127.0.0.1, so IP based limits would hit every developer at once
app.rate-limits.login-ip=1000/PT1M
app.rate-limits.registration-ip=1000/PT1M
app.rate-limits.login-email=100/PT1M

# API documentation: http://localhost:8080/swagger-ui.html (OpenAPI JSON at /v3/api-docs)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
