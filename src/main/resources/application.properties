spring.application.name=dating-recommendations-user-service

spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

# schema is owned by Flyway (src/main/resources/db/migration), Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# existing databases created by Hibernate are baselined at V1, fresh ones run all migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# recommendations with solr search, indexed via Kafka (search package)
recommender.solr.url=http://localhost:8983/solr/mycollection
recommender.solr.base-url=http://localhost:8983/solr
recommender.solr.collection=mycollection
recommender.solr.enabled=true
recommender.solr.data-seed-enabled=true
# rebuild the index from the database on every start (cheap for dev data, removes documents of older index formats)
recommender.solr.reindex-on-startup=true

# S3-compatible object storage for profile pictures (SeaweedFS in compose.yaml)
storage.endpoint=http://localhost:8333
storage.access-key=seaweed
storage.secret-key=seaweed-secret
storage.bucket-name=profile-pictures

# kafka (auto-configured by spring-boot-starter-kafka)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bjarne.datingrecommendationsuserservice.event

app.security.jwt.issuer=dating-recommendations-user-service
# HMAC key for the JWTs (at least 32 bytes). Required: set JWT_SECRET; the dev and test profiles bring their own key
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.token-ttl=PT1H
# refresh tokens (POST /api/auth/refresh) live longer; every refresh rotates them
app.security.refresh-token-ttl=P30D

# reactions per type and day (types without entry are unlimited), days start in this time zone
interaction.daily-limits.SUPER_LIKE=3
interaction.daily-limits.COMPLIMENT=5
interaction.time-zone=Europe/Berlin

# origins allowed to open the chat WebSocket (/ws), comma separated
app.websocket.allowed-origins=http://localhost:5173

# health for probes and monitoring: only /actuator/health is exposed and public, details stay hidden
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# external services for the music and game search of the profile; credentials only from the environment, never commit them.
# Without credentials the search endpoints answer 503 and everything else keeps working.
# Spotify: client credentials flow (https://developer.spotify.com/dashboard), the app owner needs Premium in development mode
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
# IGDB: Twitch app (https://dev.twitch.tv/console/apps), 4 requests per second
igdb.client-id=${TWITCH_CLIENT_ID:}
igdb.client-secret=${TWITCH_CLIENT_SECRET:}
# Steam Web API key (https://steamcommunity.com/dev/apikey), only used to suggest games from a Steam library
steam.api-key=${STEAM_API_KEY:}

# rate limits per user, email or IP (<count>/<ISO-8601 duration>), counted in memory of each instance; 429 + Retry-After
app.rate-limits.login-ip=30/PT5M
app.rate-limits.login-email=10/PT5M
app.rate-limits.registration-ip=10/PT1H
app.rate-limits.password-change=10/PT1H
app.rate-limits.reactions=120/PT1M
app.rate-limits.chat-messages=60/PT1M
app.rate-limits.reports=10/P1D
app.rate-limits.external-search=30/PT1M

# account deletion (GDPR): DELETE /api/me hides the account at once, the purge job removes all data after the grace period
app.account-deletion.grace-period=P7D
app.account-deletion.purge-cron=0 15 * * * *

# accounts that become administrators on startup (comma separated, accounts must exist); more admins via the admin API
app.security.admin-emails=

# OpenAPI document and Swagger UI: off by default, enabled in the dev profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# online status: active within the threshold counts as online; activity is written at most once per interval
app.presence.online-threshold=PT2M
app.presence.write-interval=PT1M

# notifications: read ones are deleted after the retention
app.notifications.retention=P90D
app.notifications.cleanup-cron=0 45 3 * * *
