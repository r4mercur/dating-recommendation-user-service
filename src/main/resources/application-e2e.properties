# Fixed users for frontend end-to-end tests, reset on every start with:
#   ./gradlew bootRun --args='--spring.profiles.active=dev,e2e'
# Source of truth is E2eUsers.java; the application refuses to start if these values differ from it.
# Ages are not fixed: derive them from the birth date in tests.

e2e.seed.password=e2e-password

# main test user, bob and carol show up in her recommendations
e2e.seed.users.alice.email=e2e-alice@test.local
e2e.seed.users.alice.reference-id=00000000-0000-0000-0000-00000000a11c

# same city and overlapping tags as alice
e2e.seed.users.bob.email=e2e-bob@test.local
e2e.seed.users.bob.reference-id=00000000-0000-0000-0000-000000000b0b

# has already liked alice: a like from alice creates a match
e2e.seed.users.carol.email=e2e-carol@test.local
e2e.seed.users.carol.reference-id=00000000-0000-0000-0000-00000000ca01

# status BLOCKED: login fails
e2e.seed.users.blocked.email=e2e-blocked@test.local
e2e.seed.users.blocked.reference-id=00000000-0000-0000-0000-00000000b10c

# Playwright logs in the same users many times from one IP
app.rate-limits.login-ip=10000/PT1M
app.rate-limits.login-email=10000/PT1M
app.rate-limits.registration-ip=10000/PT1M

# role ADMIN: report queue and admin API (/api/admin/**)
e2e.seed.users.admin.email=e2e-admin@test.local
e2e.seed.users.admin.reference-id=00000000-0000-0000-0000-00000000ad01
