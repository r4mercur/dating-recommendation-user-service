services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

  # S3-compatible storage for profile pictures (MinIO images are no longer published on Docker Hub)
  seaweedfs:
    image: 'chrislusf/seaweedfs:4.48'
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      # admin credentials of the S3 API; without them SeaweedFS accepts any key
      - 'AWS_ACCESS_KEY_ID=seaweed'
      - 'AWS_SECRET_ACCESS_KEY=seaweed-secret'
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs_data:/data

  solr:
    image: 'solr:10.0.0'
    ports:
      - '8983:8983'

  kafka:
    image: 'apache/kafka:4.3.1'
    ports:
      - '9092:9092'

volumes:
  seaweedfs_data:
